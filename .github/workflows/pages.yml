name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, claude/project-thread-p7995y]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Imposta la build
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" app.js index.html
          echo "{\"build\": \"$BUILD\"}" > version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
