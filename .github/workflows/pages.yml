name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, claude/project-thread-p7995y]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versione (per l'aggiornamento automatico dell'app)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/<meta name=\"app-version\" content=\"dev\">/<meta name=\"app-version\" content=\"$V\">/" index.html
          grep -q "content=\"$V\"" index.html
          printf '{"v":"%s"}\n' "$V" > version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
